name: Isolated SIB compiler research
on:
  push:
    branches: [research/sib-20260923-d302e8d]
    paths:
      - '.github/research/sib_probe.py'
      - '.github/workflows/sib-research.yml'
permissions:
  contents: read
jobs:
  witness:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Enable long paths in ephemeral runner
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/research
            tools
            build/toolchains
            baselines/bfme1/workshop-vanilla-1.03
            reverse/attempts
            reverse/attempt_support
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install disassembler
        run: python -m pip install capstone==5.0.3
      - name: Compile unchanged witness and controlled source variants
        run: python -u .github/research/sib_probe.py
      - name: Retain diagnostic sources and receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sib-research-receipts
          path: |
            build/sib_research_20260923/*.json
            build/sib_research_20260923/*.cpp
          retention-days: 3
