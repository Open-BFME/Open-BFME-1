name: X87 local-reference search
on:
  push:
    branches: [research/sib-20260923-d302e8d]
    paths:
      - '.github/research/sib_localrefs.py'
      - '.github/workflows/sib-localrefs.yml'
permissions: {contents: read}
jobs:
  search:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/research
            tools
            build/toolchains
            baselines/bfme1/workshop-vanilla-1.03
            reverse/attempts
            reverse/attempt_support
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install capstone==5.0.3
      - run: python -u .github/research/sib_localrefs.py
