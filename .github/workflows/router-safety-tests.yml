name: Router and publication safety

on:
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - '.githooks/**'
      - '.github/workflows/router-safety-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.githooks/**'
      - '.github/workflows/router-safety-tests.yml'
  workflow_dispatch:

env:
  BFME_CLAIMS: 'off'  # fixture tests must not consult live body claims

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            .githooks
            inputs/baselines/bfme1/retail-1.03-unpacked/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements.txt
      - name: Pure tests with temporary repositories and fake evidence
        run: >
          python -m pytest -q -p no:cacheprovider
          tools/tests/test_router_integrate.py
          tools/tests/test_router_state_safety.py
          tools/tests/test_verification_cache.py
          tools/tests/test_build_include_inventory.py
          tools/tests/test_object_cache.py
          tools/tests/test_opencode_router.py
          tools/tests/test_opencode_go_budget.py
          tools/tests/test_delta_sources.py
          tools/tests/test_pre_commit_argv.py
          -k 'not RouterTests'
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Fake workers requiring delegated cgroup v2 (skip when unavailable)
        run: python -m pytest -q -rs tools/tests/test_opencode_router.py -k RouterTests
