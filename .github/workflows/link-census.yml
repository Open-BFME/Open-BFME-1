name: Daily link census

# tools/fleet/daily_census.sh on a hosted runner: compile every matched source
# with the committed MSVC 7.1 under Wine, link with link.exe 7.1, record LINKED
# in link_census_history.csv (read by readme-progress.yml's README card and
# Discord post) and publish link_queue.csv. Until this workflow a person ran the
# script on a toolchain host, so a day nobody ran it left Linking stale.
#
# Objects persist in the Actions cache. build.py reuses an object only when its
# compile command, source and header hashes still match its .deps.json, and the
# census refuses to record over a stale one, so a restored cache can make a run
# faster, never wrong. Wine: WineHQ 11 (Ubuntu 24.04's own Wine 9.0 hangs cl.exe
# on a few files) with a default WoW64 prefix, as on the maintainers' host.
# WineHQ 11's cl.exe can still print a fatal error (C1083 before build.py's
# sweep-include retry) and then spin forever; build.watch_compiler kills such a
# compiler, and the census step has its own timeout so a stall of any other
# kind still leaves time to save the objects compiled so far. A cold compile
# takes about 3 h on the 4-core runner and the link about 45 min; a restored
# cache leaves mostly the link.
#
# Manual runs record nothing unless `record` is set. The daily schedule records
# (publish's `github.event_name == 'schedule'`): recorded hosted runs passed on
# 2026-10-03 and 2026-10-05, and from 10-07 to 10-10 a maintainer ran the census
# by hand on a laptop, so a day nobody did left Linking stale again. 04:23 UTC
# (off the hour, when schedules are least delayed) leaves even a cold run time to
# land before readme-progress.yml posts at 08:37 New York. Run no other census
# host alongside it: two writers race on link_status.csv.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      record:
        description: Commit the census row and queue to master
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: link-census
  cancel-in-progress: false

jobs:
  census:
    if: github.repository == 'Open-BFME/Open-BFME-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read             # builds and measures only; `publish` writes
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    env:
      BUILD_POOL: '4'            # the runner is ours alone: all cores
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='  # no Mono/Gecko prompts in wineboot
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - name: Record the census commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r tools/requirements.txt
      - name: Install WineHQ 11 and a prefix
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable
          version=$(wine --version)
          echo "$version"
          major=${version#wine-}; major=${major%%.*}
          [ "$major" -ge 11 ] || { echo "need Wine 11 or newer, got $version" >&2; exit 1; }
          echo "WINEPREFIX=$HOME/.wine-bfme" >> "$GITHUB_ENV"
          WINEPREFIX="$HOME/.wine-bfme" wineboot -i
          WINEPREFIX="$HOME/.wine-bfme" wineserver -w
      - name: Key the object cache on the toolchain
        id: cache
        run: echo "prefix=link-census-${{ hashFiles('inputs/toolchains/**') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore compiled objects
        uses: actions/cache/restore@v4
        with:
          path: build/match
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Census (compile what changed, link, record, publish the queue)
        timeout-minutes: 315     # leaves the job time to save the objects compiled so far
        run: |
          wineserver -p   # one wineserver for every cl.exe, not one per launch
          python3 tools/link_census.py --build --history
          python3 tools/link_check.py --publish
      - name: Save compiled objects
        if: always() && steps.cache.outputs.prefix != ''
        uses: actions/cache/save@v4
        with:
          path: build/match
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the census files
        uses: actions/upload-artifact@v4
        with:
          name: link-census
          if-no-files-found: error
          retention-days: 14
          path: |
            targets/game/reverse/link_census_history.csv
            targets/game/reverse/link_status.csv
            targets/game/reverse/link_queue.csv
      # The per-file index link_check.py needs (134 MB, never tracked). A separate
      # artifact, so link-census keeps its flat layout for the publish job.
      - name: Upload the census index
        uses: actions/upload-artifact@v4
        with:
          name: link-census-index
          if-no-files-found: warn
          retention-days: 7
          path: build/link_census/link_index.pkl

  # The only job that can write. It commits the census's three files on the
  # commit the census measured and rebases that one commit onto master, exactly
  # as the single-job workflow and tools/fleet/daily_census.sh do: the history
  # row names the census commit, and status/queue replace master's copies.
  publish:
    needs: census
    if: github.event_name == 'schedule' || inputs.record
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.census.outputs.commit }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: link-census
          path: ${{ runner.temp }}/link-census
      - name: Commit and push only the census files
        env:
          CENSUS: ${{ runner.temp }}/link-census
        run: |
          for name in link_census_history.csv link_status.csv link_queue.csv; do
            cp "$CENSUS/$name" "targets/game/reverse/$name"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add targets/game/reverse/link_census_history.csv targets/game/reverse/link_status.csv \
              targets/game/reverse/link_queue.csv
          git commit -q -m "link_census: daily census $(date -u +%F)" \
              -m "Recorded by .github/workflows/link-census.yml (run ${{ github.run_id }})."
          for attempt in 1 2 3 4 5; do
            git fetch -q origin +refs/heads/master:refs/remotes/origin/master
            git rebase -q --onto origin/master HEAD~1 || { git rebase --abort; exit 1; }
            git push -q origin HEAD:master && { git log -1 --format='pushed %h %s'; exit 0; }
            sleep $((attempt * 7))
          done
          echo "link census: push lost five races; this run's record is not on origin" >&2
          exit 1
