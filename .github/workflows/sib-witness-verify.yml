name: Verify exact View coordinate witness
on:
  push:
    branches: [research/sib-20260923-d302e8d]
    paths: ['.github/workflows/sib-witness-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            tools
            build/toolchains
            baselines/bfme1/workshop-vanilla-1.03
            reverse/attempts
            reverse/attempt_support
            Code/Libraries/Source/WWVegas/WWMath
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install capstone==5.0.3
      - name: Fresh compile and strict unmasked comparison
        shell: bash
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,sys
          root=Path.cwd();sys.path.insert(0,str(root/'tools'))
          import build
          out=root/'build/view_witness_verify';out.mkdir(parents=True,exist_ok=True)
          symbol='?getScreenCornerWorldPointsAtZ@View@@UAEXPAUCoord3D@@000M@Z'
          rva=0x0045C2F0;size=229
          original=(root/'reverse/attempts/0x0045c2f0.cpp').read_text()
          # The original stored source is unchanged on this research branch.
          assert hashlib.sha1(b'blob '+str(len(original.encode())).encode()+b'\0'+original.encode()).hexdigest()=='1d9dac5619ce5b0f6f8804b23c45726a709bfd3b'
          text=re.sub(r'^\s*volatile char \*viewWidthPointer = .*?;\s*$','',original,flags=re.M)
          text=text.replace('(Int)(origin.x + (unsigned)viewWidthPointer)','origin.x + viewWidth')
          text=re.sub(r'struct ICoord2D\s*\{\s*Int x;\s*Int y;\s*\};','#include "icoord.h"\ninline ICoord2D::ICoord2D() {}',text,count=1)
          text=re.sub(r'struct Coord3D\s*\{\s*Real x;\s*Real y;\s*Real z;\s*\};','struct Coord3D;',text,count=1)
          text=re.sub(r'^// partial.*\n','',text,flags=re.M)
          text=text.replace('// cl: /DNDEBUG /MD /EHsc','// cl: /DNDEBUG /MD /EHsc /ICode/Libraries/Source/WWVegas/WWMath')
          text=text.replace('#define NULL 0','#ifndef NULL\n#define NULL 0\n#endif')
          text=text.replace('inline ICoord2D::ICoord2D() {}','// Same empty constructor as WWMath/icoord.cpp. Its visible lifetime changes\n// MSVC 7.1 address selection; no instruction is inserted or patched.\ninline ICoord2D::ICoord2D() {}')
          text=re.sub(r'^// \?getScreenCornerWorldPointsAtZ.*present-unmatched\n','',text,flags=re.M)
          text='// SPDX-License-Identifier: GPL-3.0-or-later\n'+text
          text=text.replace('//'+'-------------------------------------------------------------------------------------------------','// -----------------------------------------------------------------------------')
          text=re.sub(r'\n\t{5,}Coord3D \*bottomLeft, Coord3D \*bottomRight,\n\t{5,}Real z \)','\n\tCoord3D *bottomLeft, Coord3D *bottomRight, Real z)',text)
          assert hashlib.sha256(text.encode()).hexdigest()=='9847467f1d2e289a2e2880a132f201735d9b44986a1f4b36af09f7b88ec07a01'
          receipts=[];symbols=build.load_symbol_map()
          def verify(tag,source,name,address,count,expect_exact):
              path=out/(tag+'.cpp');obj=out/(tag+'.obj')
              path.write_text(source,encoding='utf-8',newline='\n');obj.unlink(missing_ok=True)
              command,env=build.compiler_command(path,obj)
              result=subprocess.run(command,cwd=root,env=env,capture_output=True,text=True,errors='replace',timeout=45)
              assert result.returncode==0,(result.stdout,result.stderr)
              raw,relocs=build.read_object_symbol_bytes(obj,name);raw=raw.rstrip(b'\xcc')
              target=build.read_target_bytes(address,count)
              row={'name':name,'target_rva':hex(address),'target_size':str(count),'source':path.relative_to(root).as_posix(),'status':'matched','notes':''}
              resolved=build.compile_function(row,symbols,obj,retain_compiled=True)
              record={'tag':tag,'rva':hex(address),'symbol':name,'size':len(raw),'target_size':count,'raw_differences':[i for i,(a,b) in enumerate(zip(raw,target)) if a!=b],'raw_exact':raw==target,'relocations':relocs,'resolved_exact':resolved['bytes']==target,'masked':resolved['masked'],'unresolved':resolved['unresolved'],'boundary_issue':build.claimed_boundary_issue(raw,count,relocs),'source_sha256':hashlib.sha256(source.encode()).hexdigest(),'code_sha256':hashlib.sha256(raw).hexdigest(),'target_sha256':hashlib.sha256(target).hexdigest(),'compiler_args':command,'compiler_sha256':{f:hashlib.sha256((build.vc71_root()/'Vc7/bin'/f).read_bytes()).hexdigest() for f in ['cl.exe','c1xx.dll','c2.dll']},'accepted_ledger_change':False}
              assert len(raw)==count and not relocs and not resolved['masked'] and not resolved['unresolved'] and not record['boundary_issue'],record
              assert record['raw_exact']==expect_exact and record['resolved_exact']==expect_exact,record
              (out/(tag+'.json')).write_text(json.dumps(record,indent=2),encoding='utf-8')
              print('VERIFY',json.dumps(record),flush=True);receipts.append(record)
          verify('original_bank',original,symbol,rva,size,False)
          verify('ViewScreenCornerWorldPointsAtZ',text,symbol,rva,size,True)
          ctor='// cl: /DNDEBUG /MD /EHsc /ICode/Libraries/Source/WWVegas/WWMath\n#include "icoord.h"\nICoord2D::ICoord2D() {}\n'
          verify('ICoord2DConstructorWitness',ctor,'??0ICoord2D@@QAE@XZ',0x00083360,3,True)
          (out/'summary.json').write_text(json.dumps(receipts,indent=2),encoding='utf-8')
          print('SUMMARY: original remains one byte different; canonical-coordinate View witness 229/229 raw-exact; constructor 3/3 raw-exact. No source or ledger landing.',flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-view-witness-source-and-receipts
          path: |
            build/view_witness_verify/*.cpp
            build/view_witness_verify/*.json
          retention-days: 7
