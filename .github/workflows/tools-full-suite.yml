name: Tools full test suite (nightly)

# fleet-tools-tests.yml runs a hand-picked subset on every push. Everything else
# in tools/tests ran only on whichever host happened to run it, and 37 failures
# accumulated unnoticed (found and fixed 2026-09-25/26: stale expectations,
# fixtures that assumed one OS, a test that leaked the real ledger into another,
# and tools that drifted from a shared predicate). This runs the WHOLE suite on
# a full checkout once a day and on demand, so drift surfaces within a day.
# Tests needing Linux cgroup-v2 delegation skip when unavailable. The committed
# Windows toolchain is exercised through Wine, as in link-census.yml.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  BFME_CLAIMS: 'off'  # tests use fixtures, never live remote body claims
  WINEDEBUG: '-all'
  WINEDLLOVERRIDES: 'mscoree,mshtml='

permissions:
  contents: read

concurrency:
  group: tools-full-suite
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # several tests measure historical commits (progress deltas, recorded
          # dead ends at a fixed SHA), so the whole history is needed
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r tools/requirements.txt
      - name: Install WineHQ 11, ripgrep and a prefix
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable ripgrep
          command -v wine winepath rg
          version=$(wine --version)
          echo "$version"
          major=${version#wine-}; major=${major%%.*}
          [ "$major" -ge 11 ] || { echo "need Wine 11 or newer, got $version" >&2; exit 1; }
          echo "WINEPREFIX=$HOME/.wine-bfme" >> "$GITHUB_ENV"
          WINEPREFIX="$HOME/.wine-bfme" wineboot -i
          WINEPREFIX="$HOME/.wine-bfme" wineserver -w
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name 'tools-full-suite'
          git config --global user.email 'tools-full-suite@example.invalid'
          git config --global init.defaultBranch master
      - name: Full tools test suite
        run: python -m pytest -q -p no:cacheprovider -rfE tools/tests
