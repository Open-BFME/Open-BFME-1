<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" role="img" aria-labelledby="title desc">
  <title id="title">BFME 1: 83.05% rebuilt from source, 66.33% game code in C++, 11.91% linking</title>
  <desc id="desc">8,057,310 of 9,702,173 code bytes rebuild to the original's exact bytes; 5,532,977 of the game's own 8,341,057 bytes are C++.</desc>
