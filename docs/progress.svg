    <text x="28" y="256" class="muted" font-size="12.5">1,424,286 / 8,330,844 bytes of the game's own code linked (measured 2026-10-06)</text>
    <text x="28" y="286" class="strong" font-size="15" font-weight="600">Readable names<tspan class="up" dx="10" font-size="13" font-weight="600">▲ 0.01</tspan></text>
