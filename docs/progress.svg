<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-labelledby="title desc">
  <title id="title">BFME 1: 82.65% rebuilt from source, 65.88% game code in C++, 8.36% linking</title>
  <desc id="desc">8,019,317 of 9,702,173 code bytes rebuild to the original's exact bytes; 5,493,415 of the game's own 8,339,071 bytes are C++.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; }
