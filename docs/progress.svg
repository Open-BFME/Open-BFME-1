<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" role="img" aria-labelledby="title desc">
  <title id="title">BFME 1: 89.68% rebuilt from source, 73.84% game code in C++, 31.81% linking</title>
  <desc id="desc">8,700,425 of 9,702,173 code bytes rebuild to the original's exact bytes; 6,153,469 of the game's own 8,333,045 bytes are C++.</desc>
